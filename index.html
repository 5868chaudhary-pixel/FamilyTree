<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Family</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f4efe3;
font-family:Georgia,serif;
}

h1{
text-align:center;
font-size:56px;
margin:30px 0;
letter-spacing:2px;
}

.tree{
display:flex;
flex-direction:column;
align-items:center;
}

.row{
display:flex;
justify-content:center;
gap:120px;
flex-wrap:wrap;
}

.card{
width:220px;
text-align:center;
}

.card img{
width:170px;
height:170px;
object-fit:cover;
border-radius:10px;
border:4px solid #222;
}

.card h2{
margin-top:10px;
font-size:26px;
}

.card p{
font-size:16px;
margin-top:8px;
line-height:1.5;
}

.vline{
width:4px;
height:70px;
background:#222;
}

.hline{
width:420px;
height:4px;
background:#222;
}

.twolines{
width:420px;
display:flex;
justify-content:space-between;
}

.twolines div{
width:4px;
height:70px;
background:#222;
}

@media(max-width:700px){
.row{
gap:40px;
}
.hline,.twolines{
width:240px;
}
}
</style>
</head>

<body>

<h1>MY FAMILY</h1>

<div class="tree">

<div class="row">
